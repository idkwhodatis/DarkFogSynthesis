name: Verify per-machine and lab preflight fixes
on:
  push:
    branches: [master]
    paths:
      - '.github/dfs-machine-payload/**'
      - '.github/dfs-machine-smoke.py'
      - '.github/workflows/dfs-machine-fix.yml'
permissions:
  contents: read
concurrency:
  group: dfs-approved-machine-fixes
  cancel-in-progress: false
jobs:
  fix-and-verify:
    if: github.repository == 'idkwhodatis/DarkFogSynthesis'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            6.0.428
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Apply the exact reviewed patch without unrelated changes
        run: |
          python - <<'PY'
          import gzip, hashlib, subprocess
          from pathlib import Path
          subprocess.run(['git','diff','--exit-code','846e7e784704f32a719bdd5b8890a466547bda74','HEAD','--','.',':(exclude).github/dfs-machine-payload',':(exclude).github/dfs-machine-smoke.py',':(exclude).github/workflows/dfs-machine-fix.yml'],check=True)
          patch=gzip.decompress(b''.join(Path('.github/dfs-machine-payload',f'part{i}').read_bytes() for i in range(4)))
          assert hashlib.sha256(patch).hexdigest()=='169e487d51f0e7c4174cdd041dfbcb691aaee0b7f2c017719eeae59bc7446314'
          subprocess.run(['git','apply','--check','--index','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          expected={'docs/compatibility/machine-preflight-review.md','src/DarkFogSynthesis.Core/Compatibility/LabStackPreflight.cs','src/DarkFogSynthesis.Core/Compatibility/RemovalTargetGuard.cs','src/DarkFogSynthesis/Compatibility/NativeRecipeCompatibility.cs','src/DarkFogSynthesis/Compatibility/SafeRemovalService.cs','tests/DarkFogSynthesis.Core.Tests/LabStackPreflightTests.cs','tests/DarkFogSynthesis.Core.Tests/Program.cs','tests/DarkFogSynthesis.Core.Tests/RemovalTargetGuardTests.cs','tests/DarkFogSynthesis.Harmony.Tests/Program.cs','tests/DarkFogSynthesis.Harmony.Tests/RemovalTargetHarmonyTests.cs'}
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert actual==expected, actual ^ expected
          native=Path('src/DarkFogSynthesis/Compatibility/NativeRecipeCompatibility.cs').read_text()
          assert 'lab.hashBytes, lab.extraHashBytes, lab.served' in native
          assert 'LabStackPreflight.TryCollect' in native and 'LabStackPreflight.IsEmpty' in native
          removal=Path('src/DarkFogSynthesis/Compatibility/SafeRemovalService.cs').read_text()
          assert removal.count('RemovalTargetGuard.Reset(() => { RequirePausedSession(session); target.Validate(data); }')==2
          PY
      - name: Core target validation and entire connected lab-stack preflight
        run: dotnet run --project tests/DarkFogSynthesis.Core.Tests -c Release
      - name: Actual Harmony export/reset callback boundaries and existing SP tests
        run: |
          dotnet restore tests/DarkFogSynthesis.Harmony.Tests --locked-mode
          dotnet run --project tests/DarkFogSynthesis.Harmony.Tests -c Release --no-restore
      - name: Prove the new regressions detect disabled checks
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          cases=[('src/DarkFogSynthesis.Core/Compatibility/RemovalTargetGuard.cs',b'            validateTarget();\n            registerRollback(restore);',b'            registerRollback(restore);',[
            ('tests/DarkFogSynthesis.Core.Tests','Export boundary must be checked twice'),
            ('tests/DarkFogSynthesis.Harmony.Tests','Missing target revalidation')]),
            ('src/DarkFogSynthesis.Core/Compatibility/LabStackPreflight.cs',b'HasResearchState(hashBytes, extraHashBytes,',b'HasResearchState(0, 0,',[
            ('tests/DarkFogSynthesis.Core.Tests','Nonempty lab preflight admission')])]
          for name,old,new,suites in cases:
              p=Path(name); original=p.read_bytes()
              assert original.count(old)==1
              try:
                  p.write_bytes(original.replace(old,new))
                  for project,expected in suites:
                      result=subprocess.run(['dotnet','run','--project',project,'-c','Release','--no-restore'],capture_output=True,text=True,timeout=180)
                      text=result.stdout+result.stderr
                      assert result.returncode!=0 and 'error CS' not in text and expected in text, text
                      print('EXPECTED MUTATION REJECTION: '+project+' / '+name)
              finally:
                  p.write_bytes(original)
          subprocess.run(['git','diff','--exit-code'],check=True)
          PY
      - name: Assets, resources and Python diagnostic regressions
        run: |
          dotnet run --project scripts/ResourceAudit -c Release -- --self-test
          python scripts/generate-assets.py --check
          python scripts/validate-content.py
          python scripts/test-runtime-snapshots.py
          python scripts/test-ui-layout.py
          python scripts/test-unity-ui-project.py
      - name: Packaging and genuine Core build capture
        run: |
          python scripts/test-packaging.py
          python scripts/test-build-capture.py
          python scripts/test-checkout-assets.py
      - name: Pinned plugin reference compilation and metadata audit (not DSP)
        run: python .github/dfs-machine-smoke.py
      - name: Commit tested changes and remove temporary integration files
        run: |
          git fetch origin master
          test "$(git rev-parse origin/master)" = "$GITHUB_SHA"
          git diff --cached --check
          git diff --check
          git rm -r .github/dfs-machine-payload .github/dfs-machine-smoke.py .github/workflows/dfs-machine-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Revalidate each cleanup target and reject pending lab research hashes'
          git push origin HEAD:master
          echo "Tested code commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'No DSP/Unity runtime, game saves or release approval.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain source and metadata only
        if: always()
        run: |
          mkdir -p /tmp/dfs-machine-results
          git archive --format=zip -o /tmp/dfs-machine-results/source.zip HEAD
          git diff HEAD --binary > /tmp/dfs-machine-results/working-tree.patch
          git log -3 --format='%H %s' > /tmp/dfs-machine-results/commits.txt
          for report in resource-audit.json public-api-audit.json build-report.json; do
            if test -f artifacts/$report; then cp artifacts/$report /tmp/dfs-machine-results/$report; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dfs-machine-preflight-source
          path: /tmp/dfs-machine-results/
          retention-days: 3
