name: Verify source
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pure-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Pure logic and frozen specification tests (no game DLLs)
        run: dotnet run --project tests/DarkFogSynthesis.Core.Tests -c Release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PNG validation dependency
        run: python -m pip install "Pillow>=10,<13"
      - name: Validate original assets and frozen localized content
        run: |
          python scripts/generate-assets.py --check
          python scripts/validate-content.py
      - name: Verify packaging and release-refusal guards
        run: python scripts/test-packaging.py
      - name: Check patch formatting
        run: git show --format= --check HEAD
      - name: State verification boundary
        run: echo 'No game integration, installed-dependency runtime build, save, integrity, or uninstall tests were run by this job.'
