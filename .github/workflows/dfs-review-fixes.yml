name: Verify and commit approved review fixes
on:
  push:
    branches: [master]
    paths:
      - '.github/dfs-review-fixes.patch.gz'
      - '.github/dfs-review-fixes-smoke.py'
      - '.github/workflows/dfs-review-fixes.yml'
permissions:
  contents: read
concurrency:
  group: dfs-approved-review-fixes
  cancel-in-progress: false
jobs:
  fix-and-verify:
    if: github.repository == 'idkwhodatis/DarkFogSynthesis'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            6.0.428
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Apply exactly the approved patch to the reviewed baseline
        run: |
          python - <<'PY'
          import gzip, hashlib, subprocess
          from pathlib import Path
          subprocess.run(['git','diff','--exit-code','cb24eed2147b107b50fc654f7c596891a3860194','HEAD','--','.',':(exclude).github/dfs-review-fixes*',':(exclude).github/workflows/dfs-review-fixes.yml'],check=True)
          patch=gzip.decompress(Path('.github/dfs-review-fixes.patch.gz').read_bytes())
          assert hashlib.sha256(patch).hexdigest()=='ae084cb5a08b58e8ad79f7053b9a8407cf6a380d8ed4b9b3685552842daa1ce2'
          subprocess.run(['git','apply','--check','--index','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          # The full reference build requires a real null guard, not a Require
          # method whose contract the nullable compiler cannot observe.
          path=Path('src/DarkFogSynthesis/Progression/RuntimeProgression.cs')
          old='                var tech = LDB.techs.Select(entry.Key);\n                ContentRegistry.Require(tech != null, "Missing technology with an owned prerequisite cache: " + entry.Key);'
          new='                var tech = LDB.techs.Select(entry.Key)\n                    ?? throw new InvalidOperationException("Missing technology with an owned prerequisite cache: " + entry.Key);'
          text=path.read_text(encoding='utf-8')
          assert text.count(old)==1, 'Native null-guard correction no longer matches'
          path.write_text(text.replace(old,new),encoding='utf-8')
          subprocess.run(['git','add',str(path)],check=True)
          expected={'src/DarkFogSynthesis/Progression/RuntimeProgression.cs','src/DarkFogSynthesis.Core/Progression/PrerequisiteCachePolicy.cs','tests/DarkFogSynthesis.Core.Tests/PrerequisiteCachePolicyTests.cs','tests/DarkFogSynthesis.Core.Tests/Program.cs','scripts/compare-runtime-snapshots.py','scripts/test-runtime-snapshots.py','src/DarkFogSynthesis/Diagnostics/UiLayoutCapture.cs','src/DarkFogSynthesis/Diagnostics/RectMaskClipCapture.cs','scripts/check-ui-layout.py','scripts/test-ui-layout.py','scripts/prepare-unity-ui-tests.py','tests/DarkFogSynthesis.Unity.Tests/RectMaskClipCaptureTests.cs','tests/DarkFogSynthesis.Unity.Tests/README.md','docs/compatibility/cache-diagnostics-review.md'}
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert actual==expected, actual ^ expected
          PY
      - name: Core production regression tests
        run: dotnet run --project tests/DarkFogSynthesis.Core.Tests -c Release
      - name: Actual Harmony managed fixtures (not DSP)
        run: |
          dotnet restore tests/DarkFogSynthesis.Harmony.Tests --locked-mode
          dotnet run --project tests/DarkFogSynthesis.Harmony.Tests -c Release --no-restore
      - name: Resources, content and diagnostic regressions
        run: |
          dotnet run --project scripts/ResourceAudit -c Release -- --self-test
          python scripts/generate-assets.py --check
          python scripts/validate-content.py
          python scripts/test-runtime-snapshots.py
          python scripts/test-ui-layout.py
      - name: Prepare exact optional Unity test sources (engine not executed)
        run: |
          python scripts/prepare-unity-ui-tests.py "$RUNNER_TEMP/dfs-unity-fixture"
          cmp src/DarkFogSynthesis/Diagnostics/RectMaskClipCapture.cs "$RUNNER_TEMP/dfs-unity-fixture/Assets/Tests/Editor/RectMaskClipCapture.cs"
      - name: Packaging, compiler capture and fresh checkouts
        run: |
          python scripts/test-packaging.py
          python scripts/test-build-capture.py
          python scripts/test-checkout-assets.py
      - name: Pinned reference compilation and metadata audits (not game execution)
        run: python .github/dfs-review-fixes-smoke.py
      - name: Commit tested fixes and remove this temporary writer
        run: |
          git fetch origin master
          test "$(git rev-parse origin/master)" = "$GITHUB_SHA"
          git diff --cached --check
          git diff --check
          git rm .github/dfs-review-fixes.patch.gz .github/dfs-review-fixes-smoke.py .github/workflows/dfs-review-fixes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix prerequisite cache restoration and diagnostic false passes'
          git push origin HEAD:master
          echo "Tested code commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'Unity/DSP runtime, saves and game acceptance NOT EXECUTED.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain source and metadata only
        if: always()
        run: |
          mkdir -p /tmp/dfs-review-results
          git archive --format=zip -o /tmp/dfs-review-results/source.zip HEAD
          git diff HEAD --binary > /tmp/dfs-review-results/working-tree.patch
          git log -3 --format='%H %s' > /tmp/dfs-review-results/commits.txt
          for report in resource-audit.json public-api-audit.json build-report.json; do
            if test -f artifacts/$report; then cp artifacts/$report /tmp/dfs-review-results/$report; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dfs-review-fixes-source
          path: /tmp/dfs-review-results/
          retention-days: 3
