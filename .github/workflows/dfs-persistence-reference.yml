name: Reference build for persistence safety fixes
on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/dfs-persistence-reference.yml'
permissions:
  contents: read
jobs:
  reference-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Compile current plugin and exact Unity fixture against pinned references
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f .github/dfs-persistence-reference.py' EXIT
          git show 6e9c664f681cb260c26da845c5a4431e5805abbc:.github/dfs-machine-smoke.py > .github/dfs-persistence-reference.py
          python .github/dfs-persistence-reference.py
          git diff --exit-code
      - name: Retain source and non-executable audit evidence
        run: |
          mkdir -p /tmp/dfs-persistence-review
          git archive --format=zip -o /tmp/dfs-persistence-review/source.zip HEAD
          cp artifacts/resource-audit.json artifacts/public-api-audit.json /tmp/dfs-persistence-review/
          echo 'Reference compilation only; no DSP/Unity execution, game saves or integrity approval.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: persistence-reviewed-source
          path: /tmp/dfs-persistence-review/
          retention-days: 3
          if-no-files-found: error
