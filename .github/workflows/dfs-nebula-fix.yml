name: Verify single-player-safe Nebula guard
on:
  push:
    branches: [master]
    paths:
      - '.github/dfs-nebula-payload/**'
      - '.github/dfs-nebula-smoke.py'
      - '.github/workflows/dfs-nebula-fix.yml'
permissions:
  contents: read
concurrency:
  group: dfs-approved-nebula-fix
  cancel-in-progress: false
jobs:
  fix-and-verify:
    if: github.repository == 'idkwhodatis/DarkFogSynthesis'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            6.0.428
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Apply exact reviewed patch without overwriting concurrent changes
        run: |
          python - <<'PY'
          import gzip, hashlib, subprocess
          from pathlib import Path
          subprocess.run(['git','diff','--exit-code','df7ea277c62ea3cd0c00634cccc461c1050e3698','HEAD','--','.',':(exclude).github/dfs-nebula-payload',':(exclude).github/dfs-nebula-smoke.py',':(exclude).github/workflows/dfs-nebula-fix.yml'],check=True)
          payload=b''.join(Path('.github/dfs-nebula-payload',f'part{i}').read_bytes() for i in range(2))
          patch=gzip.decompress(payload)
          assert hashlib.sha256(patch).hexdigest()=='5192b6c33924390e752769984c3e04c2196a123a8e23865f3eb9b1fb41e9eab4'
          subprocess.run(['git','apply','--check','--index','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          expected={'README.md','docs/compatibility/nebula-session-guard.md','src/DarkFogSynthesis.Core/Compatibility/MultiplayerSessionProbe.cs','src/DarkFogSynthesis/Compatibility/MultiplayerCompatibilityGuard.cs','src/DarkFogSynthesis/Compatibility/NativeRecipeCompatibility.cs','src/DarkFogSynthesis/Plugin.cs','tests/DarkFogSynthesis.Core.Tests/MultiplayerSessionProbeTests.cs','tests/DarkFogSynthesis.Core.Tests/Program.cs','tests/DarkFogSynthesis.Harmony.Tests/Program.cs'}
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert actual==expected, actual ^ expected
          PY
      - name: Core including absent and inactive single-player regressions
        run: dotnet run --project tests/DarkFogSynthesis.Core.Tests -c Release
      - name: Actual Harmony entry, save, transition and recovery fixtures (no DSP)
        run: |
          dotnet restore tests/DarkFogSynthesis.Harmony.Tests --locked-mode
          dotnet run --project tests/DarkFogSynthesis.Harmony.Tests -c Release --no-restore
      - name: Confirm both suites detect an accidentally disabled active-session check
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('src/DarkFogSynthesis.Core/Compatibility/MultiplayerSessionProbe.cs')
          original=p.read_bytes()
          old=b'return readActive() ? MultiplayerSessionStatus.Active : MultiplayerSessionStatus.SinglePlayer;'
          assert original.count(old)==1
          try:
              p.write_bytes(original.replace(old,b'return MultiplayerSessionStatus.SinglePlayer;'))
              for project, expected in (('tests/DarkFogSynthesis.Core.Tests','Host/client activity'),('tests/DarkFogSynthesis.Harmony.Tests','Active MP must refuse native entry')):
                  result=subprocess.run(['dotnet','run','--project',project,'-c','Release','--no-restore'],capture_output=True,text=True,timeout=180)
                  text=result.stdout+result.stderr
                  assert result.returncode!=0 and 'error CS' not in text and expected in text, text
                  print('EXPECTED MUTATION REJECTION: '+project)
          finally:
              p.write_bytes(original)
          subprocess.run(['git','diff','--exit-code'],check=True)
          PY
      - name: Resources, content and existing diagnostic tests
        run: |
          dotnet run --project scripts/ResourceAudit -c Release -- --self-test
          python scripts/generate-assets.py --check
          python scripts/validate-content.py
          python scripts/test-runtime-snapshots.py
          python scripts/test-ui-layout.py
          python scripts/test-unity-ui-project.py
      - name: Packaging, actual Core build capture and checkout regressions
        run: |
          python scripts/test-packaging.py
          python scripts/test-build-capture.py
          python scripts/test-checkout-assets.py
      - name: Pinned plugin reference compilation and metadata audits (not game execution)
        run: python .github/dfs-nebula-smoke.py
      - name: Commit tested code and remove the temporary integration files
        run: |
          git fetch origin master
          test "$(git rev-parse origin/master)" = "$GITHUB_SHA"
          git diff --cached --check
          git diff --check
          git rm -r .github/dfs-nebula-payload .github/dfs-nebula-smoke.py .github/workflows/dfs-nebula-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Guard active Nebula sessions while preserving inactive single-player'
          git push origin HEAD:master
          echo "Tested code commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'No Unity, DSP, Nebula runtime, real game saves, or release approval.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain source and metadata only
        if: always()
        run: |
          mkdir -p /tmp/dfs-nebula-results
          git archive --format=zip -o /tmp/dfs-nebula-results/source.zip HEAD
          git diff HEAD --binary > /tmp/dfs-nebula-results/working-tree.patch
          git log -3 --format='%H %s' > /tmp/dfs-nebula-results/commits.txt
          for report in resource-audit.json public-api-audit.json build-report.json; do
            if test -f artifacts/$report; then cp artifacts/$report /tmp/dfs-nebula-results/$report; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dfs-nebula-guard-source
          path: /tmp/dfs-nebula-results/
          retention-days: 3
