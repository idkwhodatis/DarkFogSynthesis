name: Verify effective UI masks (reference only)
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/dfs-mask-reference.yml'
      - 'src/DarkFogSynthesis/Diagnostics/RectMaskClipCapture.cs'
      - 'src/DarkFogSynthesis/Diagnostics/UiLayoutCapture.cs'
      - 'tests/DarkFogSynthesis.Unity.Tests/RectMaskClipCaptureTests.cs'
permissions:
  contents: read
jobs:
  reference-compilation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Check diagnostic fixtures and unchanged generated source
        run: |
          python scripts/test-ui-layout.py
          python scripts/test-unity-ui-project.py
          python scripts/test-runtime-snapshots.py
      - name: Compile plugin and exact Unity fixture against pinned references (no engine execution)
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f .github/dfs-mask-reference.py' EXIT
          git show 6e9c664f681cb260c26da845c5a4431e5805abbc:.github/dfs-machine-smoke.py > .github/dfs-mask-reference.py
          python .github/dfs-mask-reference.py
          git diff --exit-code
      - name: Record the verification boundary
        run: |
          echo 'Full plugin and exact optional Unity fixture reference-compiled; Unity/DSP NOT EXECUTED.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Ordinary source CI is separate; no release approval, saves or multiplayer changes.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: mask-reference-audits
          path: |
            artifacts/resource-audit.json
            artifacts/public-api-audit.json
          if-no-files-found: error
          retention-days: 3
